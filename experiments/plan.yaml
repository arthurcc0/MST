# PENN BI-RADS-4 experiment plan — the only file to edit.
#
#   python scripts/experiments/run_plan.py status             # what is done / blocked
#   python scripts/experiments/run_plan.py run --phase 1 --machine cluster --dry-run
#   python scripts/experiments/run_plan.py run --phase 1 --machine cluster
#
# On SLURM always pass --machine cluster (compute-node hostnames are not stable).
#
# Protocol: locked new-Penn holdout = original Fold-0 test (~205 exams).
# Fold 0–4 below are INNER CV on the remaining ~817 (rotate val). Rank configs
# by val_auc_mean. Do not pick on test_auc (that is the same holdout every fold).
# After a winner is frozen, retrain it with each outer group as holdout and
# pool those five test predictions for the reported AUC.
#
# Frozen: staged + n32 MIP + DINOv3-B (P3_staged_v3_b, val 0.7525).
# Tissue weighting ON (keep_ratio=0.5, min_weight=0.1). P2b turned the
# whole gate off (all tokens weight 1); AUC tied, keep ON for attention maps.
#
# Splits:
#   new_penn_datasplit_v5_holdoutF0.csv
#   old_penn_datasplit_trainval.csv          # no old-Penn test; more stage-1 data
#   joint_penn_datasplit_holdoutF0.csv       # old train+val grafted as extra train
#
# Templates: any string may use {field} from the experiment's train settings or
# grid values, e.g. id: "P3_staged_{model_size}".

machines:
  default:
    python: null
    data_root: D:\Users\arthur\Data\MST_birads4
    runs_root: runs
    predict_output_dir: .
  cluster:
    python: null
    data_root: /vast/projects/bbruno/breast-imaging/arthur/MST_data
    runs_root: /vast/projects/bbruno/breast-imaging/arthur/MST_runs
    predict_output_dir: /vast/projects/bbruno/breast-imaging/arthur/MST_results
    train_overrides:
      path_root_data: "{path_root_data}.h5"
      num_workers: 8
    predict_overrides: {}

defaults:
  folds: [0, 1, 2, 3, 4]
  train:
    dataset: PENN
    model_name: DinoClassifierSlice
    model_size: s
    use_registers: true
    input_type: subtraction
    path_root_data: final_cropped_and_masked_slabs_n32_s3_o0
    slices: 32
    slab_tissue_soft_weight: true
    high_risk_policy: malignant
    dcis_policy: malignant
    num_workers: 2
    seed: 123
    class_weight: balanced
    batch_size_by_model_size: {s: 8, b: 4, l: 2, g: 1}
  eval:
    splits: [val]                # selection only; holdout test after a winner is frozen
    high_risk_policy: malignant
    dcis_policy: malignant

experiments:

  # ======================================================================
  # Phase 1 — joint vs staged, ViT-S, n32 MIP, holdout+inner CV.
  # Rank on val_auc_mean. Same unfreeze/LR/balanced CE on both recipes.
  # Old Penn is train/val only (stage 1 uses that val; joint grafts both as train).
  # ======================================================================
  - id: P1_stage1_oldpenn_s
    phase: 1
    enabled: true
    description: Stage 1 — DINOv2-S on old-Penn train, early-stop on old-Penn val.
    folds: [0]
    eval: false
    train:
      penn_split_csv: old_penn_datasplit_trainval.csv
      high_risk_policy: exclude

  - id: P1_staged_s
    phase: 1
    enabled: true
    description: Stage 2 — inner 5-fold on new Penn from P1_stage1_oldpenn_s.
    init_from: {experiment: P1_stage1_oldpenn_s, fold: 0}
    train:
      penn_split_csv: new_penn_datasplit_v5_holdoutF0.csv
      unfreeze_encoder_blocks: 2
      learning_rate: 1.0e-5
      encoder_lr: 1.0e-6

  - id: P1_stage1_on_newpenn
    phase: 1
    enabled: true
    description: Stage-1 only, scored on new-Penn inner val (no BI-RADS-4 fine-tune).
    eval_from: {experiment: P1_stage1_oldpenn_s, fold: 0}
    train:
      penn_split_csv: new_penn_datasplit_v5_holdoutF0.csv
      high_risk_policy: malignant

  - id: P1_joint_s
    phase: 1
    enabled: true
    description: Joint — old train+val grafted as extra train on every inner fold.
    train:
      penn_split_csv: joint_penn_datasplit_holdoutF0.csv

  # ======================================================================
  # Phase 2 — input: MIP vs contiguous raw vs gaussian-quantile sampling.
  # Question: does more depth (n40 MIP / raw 96–120) help, or is n32 MIP
  # / gauss-32 enough under a memory cap? n40 MIP = 120 z (dataset median).
  # Each non-baseline input gets its own old-Penn stage 1; stage 2 inits
  # from that matching ckpt (not from P1 n32 MIP). n32 MIP is
  # P1_stage1_oldpenn_s / P1_staged_s; do not retrain it.
  # Staged is the P1 winner; joint copies stay off unless that ranking changes.
  #
  # Result (val_auc_mean, inner 5-fold): P1_staged_s n32 MIP 0.7449;
  # raw 96 0.7303; raw 120 0.7302; n40 MIP 0.7288; gauss-32 0.7285.
  # Under the rank-on-val rule, freeze n32 MIP. Cost of n40 is ~25% more
  # ViT forwards, not a reason to override the val ranking.
  # ======================================================================
  - id: P2_stage1_oldpenn_s_slabs{slices}
    phase: 2
    enabled: false
    description: Stage 1, {slices} MIP slabs on old Penn.
    grid: {slices: [40]}
    folds: [0]
    eval: false
    train:
      penn_split_csv: old_penn_datasplit_trainval.csv
      high_risk_policy: exclude
      path_root_data: final_cropped_and_masked_slabs_n{slices}_s3_o0

  - id: P2_staged_s_slabs{slices}
    phase: 2
    enabled: false
    description: Stage 2, {slices} MIP slabs (n40 = 120 z).
    grid: {slices: [40]}
    init_from: {experiment: "P2_stage1_oldpenn_s_slabs{slices}", fold: 0}
    train:
      penn_split_csv: new_penn_datasplit_v5_holdoutF0.csv
      unfreeze_encoder_blocks: 2
      learning_rate: 1.0e-5
      encoder_lr: 1.0e-6
      path_root_data: final_cropped_and_masked_slabs_n{slices}_s3_o0

  - id: P2_stage1_oldpenn_s_raw{slices}
    phase: 2
    enabled: false
    description: Stage 1, {slices} contiguous raw slices on old Penn.
    grid: {slices: [96, 120]}
    folds: [0]
    eval: false
    train:
      penn_split_csv: old_penn_datasplit_trainval.csv
      high_risk_policy: exclude
      path_root_data: final_cropped_and_masked_data_d{slices}

  - id: P2_staged_s_raw{slices}
    phase: 2
    enabled: false
    description: Stage 2, {slices} contiguous raw slices (96 = n32 span; 120 = n40 span).
    grid: {slices: [96, 120]}
    init_from: {experiment: "P2_stage1_oldpenn_s_raw{slices}", fold: 0}
    train:
      penn_split_csv: new_penn_datasplit_v5_holdoutF0.csv
      unfreeze_encoder_blocks: 2
      learning_rate: 1.0e-5
      encoder_lr: 1.0e-6
      path_root_data: final_cropped_and_masked_data_d{slices}

  - id: P2_stage1_oldpenn_s_gauss{slices}
    phase: 2
    enabled: false
    description: Stage 1, {slices} gaussian-sampled raw slices on old Penn.
    grid: {slices: [32]}
    folds: [0]
    eval: false
    train:
      penn_split_csv: old_penn_datasplit_trainval.csv
      high_risk_policy: exclude
      path_root_data: final_cropped_and_masked_gauss_d{slices}

  - id: P2_staged_s_gauss{slices}
    phase: 2
    enabled: false
    description: Stage 2, {slices} raw slices sampled from N(center, sigma=20).
    grid: {slices: [32]}
    init_from: {experiment: "P2_stage1_oldpenn_s_gauss{slices}", fold: 0}
    train:
      penn_split_csv: new_penn_datasplit_v5_holdoutF0.csv
      unfreeze_encoder_blocks: 2
      learning_rate: 1.0e-5
      encoder_lr: 1.0e-6
      path_root_data: final_cropped_and_masked_gauss_d{slices}

  - id: P2_joint_s_slabs{slices}
    phase: 2
    enabled: false
    description: Joint, {slices} MIP slabs.
    grid: {slices: [40]}
    train:
      penn_split_csv: joint_penn_datasplit_holdoutF0.csv
      path_root_data: final_cropped_and_masked_slabs_n{slices}_s3_o0

  - id: P2_joint_s_raw{slices}
    phase: 2
    enabled: false
    description: Joint, {slices} contiguous raw slices.
    grid: {slices: [96, 120]}
    train:
      penn_split_csv: joint_penn_datasplit_holdoutF0.csv
      path_root_data: final_cropped_and_masked_data_d{slices}

  - id: P2_joint_s_gauss{slices}
    phase: 2
    enabled: false
    description: Joint, {slices} gaussian-sampled raw slices.
    grid: {slices: [32]}
    train:
      penn_split_csv: joint_penn_datasplit_holdoutF0.csv
      path_root_data: final_cropped_and_masked_gauss_d{slices}

  # ======================================================================
  # Phase 2b — whole tissue-weight gate OFF (not just the 0.1 floor).
  # OFF: no keep_ratio hinge, no min_weight; every slice token is 1.0.
  # ON (default): planes with tissue < 0.5 * max(frac) ramp down toward 0.1.
  # Matched stage 1 + inner 5-fold. MIP / gauss-32 / raw 96 AUC tied with ON;
  # keep the gate ON for attention-map visualization.
  # ======================================================================
  - id: P2b_stage1_oldpenn_s_mip_weightOff
    phase: 2
    enabled: true
    description: Stage 1, n32 MIP, tissue weighting off.
    folds: [0]
    eval: false
    train:
      penn_split_csv: old_penn_datasplit_trainval.csv
      high_risk_policy: exclude
      path_root_data: final_cropped_and_masked_slabs_n32_s3_o0
      slices: 32
      slab_tissue_soft_weight: false

  - id: P2b_staged_s_mip_weightOff
    phase: 2
    enabled: false
    description: Stage 2, n32 MIP, tissue weighting off.
    init_from: {experiment: P2b_stage1_oldpenn_s_mip_weightOff, fold: 0}
    train:
      penn_split_csv: new_penn_datasplit_v5_holdoutF0.csv
      unfreeze_encoder_blocks: 2
      learning_rate: 1.0e-5
      encoder_lr: 1.0e-6
      path_root_data: final_cropped_and_masked_slabs_n32_s3_o0
      slices: 32
      slab_tissue_soft_weight: false

  - id: P2b_stage1_oldpenn_s_gauss32_weightOff
    phase: 2
    enabled: true
    description: Stage 1, gauss-32, tissue weighting off.
    folds: [0]
    eval: false
    train:
      penn_split_csv: old_penn_datasplit_trainval.csv
      high_risk_policy: exclude
      path_root_data: final_cropped_and_masked_gauss_d32
      slices: 32
      slab_tissue_soft_weight: false

  - id: P2b_staged_s_gauss32_weightOff
    phase: 2
    enabled: false
    description: Stage 2, gauss-32, tissue weighting off.
    init_from: {experiment: P2b_stage1_oldpenn_s_gauss32_weightOff, fold: 0}
    train:
      penn_split_csv: new_penn_datasplit_v5_holdoutF0.csv
      unfreeze_encoder_blocks: 2
      learning_rate: 1.0e-5
      encoder_lr: 1.0e-6
      path_root_data: final_cropped_and_masked_gauss_d32
      slices: 32
      slab_tissue_soft_weight: false

  - id: P2b_stage1_oldpenn_s_raw96_weightOff
    phase: 2
    enabled: true
    description: Stage 1, raw 96, tissue weighting off.
    folds: [0]
    eval: false
    train:
      penn_split_csv: old_penn_datasplit_trainval.csv
      high_risk_policy: exclude
      path_root_data: final_cropped_and_masked_data_d96
      slices: 96
      slab_tissue_soft_weight: false

  - id: P2b_staged_s_raw96_weightOff
    phase: 2
    enabled: false
    description: Stage 2, raw 96, tissue weighting off.
    init_from: {experiment: P2b_stage1_oldpenn_s_raw96_weightOff, fold: 0}
    train:
      penn_split_csv: new_penn_datasplit_v5_holdoutF0.csv
      unfreeze_encoder_blocks: 2
      learning_rate: 1.0e-5
      encoder_lr: 1.0e-6
      path_root_data: final_cropped_and_masked_data_d96
      slices: 96
      slab_tissue_soft_weight: false

  # ======================================================================
  # Phase 3 — backbone size and DINOv2 vs DINOv3, on frozen n32 MIP staged.
  # ViT-S is P1_staged_s; do not retrain it. Joint size copies stay off.
  # Explicit path/slices so later default edits cannot silently change input.
  # ======================================================================
  - id: P3_stage1_oldpenn_{model_size}
    phase: 3
    enabled: true
    description: Stage 1, DINOv2-{model_size} n32 MIP (s is P1_stage1_oldpenn_s).
    grid: {model_size: [b, l]}
    folds: [0]
    eval: false
    train:
      penn_split_csv: old_penn_datasplit_trainval.csv
      high_risk_policy: exclude
      path_root_data: final_cropped_and_masked_slabs_n32_s3_o0
      slices: 32

  - id: P3_staged_{model_size}
    phase: 3
    enabled: true
    description: Stage 2, DINOv2-{model_size}, n32 MIP.
    grid: {model_size: [b, l]}
    init_from: {experiment: "P3_stage1_oldpenn_{model_size}", fold: 0}
    train:
      penn_split_csv: new_penn_datasplit_v5_holdoutF0.csv
      unfreeze_encoder_blocks: 2
      learning_rate: 1.0e-5
      encoder_lr: 1.0e-6
      path_root_data: final_cropped_and_masked_slabs_n32_s3_o0
      slices: 32

  - id: P3_stage1_oldpenn_v3_{model_size}
    phase: 3
    enabled: true
    description: Stage 1, DINOv3-{model_size}, n32 MIP.
    grid: {model_size: [s, b, l]}
    folds: [0]
    eval: false
    train:
      model_name: DinoClassifierSliceV3
      penn_split_csv: old_penn_datasplit_trainval.csv
      high_risk_policy: exclude
      path_root_data: final_cropped_and_masked_slabs_n32_s3_o0
      slices: 32

  - id: P3_staged_v3_{model_size}
    phase: 3
    enabled: true
    description: Stage 2, DINOv3-{model_size}, n32 MIP.
    grid: {model_size: [s, b, l]}
    init_from: {experiment: "P3_stage1_oldpenn_v3_{model_size}", fold: 0}
    train:
      model_name: DinoClassifierSliceV3
      penn_split_csv: new_penn_datasplit_v5_holdoutF0.csv
      unfreeze_encoder_blocks: 2
      learning_rate: 1.0e-5
      encoder_lr: 1.0e-6
      path_root_data: final_cropped_and_masked_slabs_n32_s3_o0
      slices: 32

  - id: P3_joint_{model_size}
    phase: 3
    enabled: false
    description: Joint, DINOv2-{model_size} (staged won phase 1; leave off).
    grid: {model_size: [b, l]}
    train:
      penn_split_csv: joint_penn_datasplit_holdoutF0.csv
      path_root_data: final_cropped_and_masked_slabs_n32_s3_o0
      slices: 32

  # ======================================================================
  # Phase 4 — loss, on frozen DINOv3-B n32 MIP. Balanced CE is P3_staged_v3_b
  # (0.7525); do not rerun it. Tissue weighting stays ON.
  # ======================================================================
  - id: P4_staged_v3_{model_size}_ceNoWeight
    phase: 4
    enabled: false
    description: Stage 2, DINOv3-{model_size}, unweighted CE.
    grid: {model_size: [b]}
    init_from: {experiment: P3_stage1_oldpenn_v3_b, fold: 0}
    train:
      model_name: DinoClassifierSliceV3
      penn_split_csv: new_penn_datasplit_v5_holdoutF0.csv
      unfreeze_encoder_blocks: 2
      learning_rate: 1.0e-5
      encoder_lr: 1.0e-6
      path_root_data: final_cropped_and_masked_slabs_n32_s3_o0
      slices: 32
      class_weight: none

  - id: P4_staged_v3_{model_size}_focal_g{focal_gamma}_a{focal_alpha}
    phase: 4
    enabled: false
    description: Stage 2, DINOv3-{model_size}, focal loss.
    grid: {model_size: [b], focal_gamma: [2.0], focal_alpha: [balanced]}
    init_from: {experiment: P3_stage1_oldpenn_v3_b, fold: 0}
    train:
      model_name: DinoClassifierSliceV3
      penn_split_csv: new_penn_datasplit_v5_holdoutF0.csv
      unfreeze_encoder_blocks: 2
      learning_rate: 1.0e-5
      encoder_lr: 1.0e-6
      path_root_data: final_cropped_and_masked_slabs_n32_s3_o0
      slices: 32
      loss: focal

  - id: P4_joint_v3_{model_size}_ceNoWeight
    phase: 4
    enabled: false
    description: Joint, DINOv3-{model_size}, unweighted CE (staged won; leave off).
    grid: {model_size: [b]}
    train:
      model_name: DinoClassifierSliceV3
      penn_split_csv: joint_penn_datasplit_holdoutF0.csv
      path_root_data: final_cropped_and_masked_slabs_n32_s3_o0
      slices: 32
      class_weight: none

  - id: P4_joint_v3_{model_size}_focal_g{focal_gamma}_a{focal_alpha}
    phase: 4
    enabled: false
    description: Joint, DINOv3-{model_size}, focal loss (staged won; leave off).
    grid: {model_size: [b], focal_gamma: [2.0], focal_alpha: [balanced]}
    train:
      model_name: DinoClassifierSliceV3
      penn_split_csv: joint_penn_datasplit_holdoutF0.csv
      path_root_data: final_cropped_and_masked_slabs_n32_s3_o0
      slices: 32
      loss: focal

  # ======================================================================
  # Phase 5 — unfreeze / LR, DINOv3-B n32 MIP. Main grid result: unfreeze 2,
  # head 1e-5, encoder 1e-6 (P3_staged_v3_b, 0.7525) still best. Leftover:
  # unfreeze 1 ties (0.7525 ± 0.022); head 1e-6 loses. Weighting ON.
  # Do not rerun finished grid IDs. Seed repeat is phase 6.
  # ======================================================================
  - id: P5_staged_v3_{model_size}_unfrz{unfreeze_encoder_blocks}_lr{learning_rate}_enc{encoder_lr}
    phase: 5
    enabled: false
    description: Stage 2 sweep, DINOv3-{model_size}.
    grid:
      model_size: [b]
      unfreeze_encoder_blocks: [0, 2, 4]
      learning_rate: [1.0e-5, 1.0e-4]
      encoder_lr: [1.0e-6, 1.0e-5]
    init_from: {experiment: P3_stage1_oldpenn_v3_b, fold: 0}
    train:
      model_name: DinoClassifierSliceV3
      penn_split_csv: new_penn_datasplit_v5_holdoutF0.csv
      path_root_data: final_cropped_and_masked_slabs_n32_s3_o0
      slices: 32

  - id: P5_staged_v3_{model_size}_unfrz{unfreeze_encoder_blocks}_lr{learning_rate}_enc{encoder_lr}
    phase: 5
    enabled: false
    description: Unfreeze 1 at the frozen LRs (between 0 and 2).
    grid:
      model_size: [b]
      unfreeze_encoder_blocks: [1]
      learning_rate: [1.0e-5]
      encoder_lr: [1.0e-6]
    init_from: {experiment: P3_stage1_oldpenn_v3_b, fold: 0}
    train:
      model_name: DinoClassifierSliceV3
      penn_split_csv: new_penn_datasplit_v5_holdoutF0.csv
      path_root_data: final_cropped_and_masked_slabs_n32_s3_o0
      slices: 32

  - id: P5_staged_v3_{model_size}_unfrz{unfreeze_encoder_blocks}_lr{learning_rate}_enc{encoder_lr}
    phase: 5
    enabled: false
    description: Smaller head LR at unfreeze 2 (boundary below 1e-5).
    grid:
      model_size: [b]
      unfreeze_encoder_blocks: [2]
      learning_rate: [1.0e-6]
      encoder_lr: [1.0e-6]
    init_from: {experiment: P3_stage1_oldpenn_v3_b, fold: 0}
    train:
      model_name: DinoClassifierSliceV3
      penn_split_csv: new_penn_datasplit_v5_holdoutF0.csv
      path_root_data: final_cropped_and_masked_slabs_n32_s3_o0
      slices: 32

  - id: P5_joint_v3_{model_size}_lr{learning_rate}_enc{encoder_lr}
    phase: 5
    enabled: false
    description: Joint LR sweep, DINOv3-{model_size} (staged won; leave off).
    grid:
      model_size: [b]
      learning_rate: [1.0e-6, 1.0e-5]
      encoder_lr: [1.0e-7, 1.0e-6]
    train:
      model_name: DinoClassifierSliceV3
      penn_split_csv: joint_penn_datasplit_holdoutF0.csv
      path_root_data: final_cropped_and_masked_slabs_n32_s3_o0
      slices: 32

  # ======================================================================
  # Phase 6 — seed repeat of the two val-tied recipes (unfreeze 1 vs 2,
  # head 1e-5, encoder 1e-6). Same P3_stage1_oldpenn_v3_b ckpt; do not
  # retrain stage 1. Seed 123 is P3_staged_v3_b / P5_…_unfrz1_….
  # Tie-break on val only: seed-mean of val_auc_mean; if within ~0.005,
  # lower fold-AUC std; if still tied, keep unfreeze 2. Then outer rotate.
  # ======================================================================
  - id: P6_staged_v3_{model_size}_unfrz{unfreeze_encoder_blocks}_lr{learning_rate}_enc{encoder_lr}_seed{seed}
    phase: 6
    enabled: false
    description: Stage 2 seed repeat, unfreeze {unfreeze_encoder_blocks}, seed {seed}.
    grid:
      model_size: [b]
      unfreeze_encoder_blocks: [1, 2]
      learning_rate: [1.0e-5]
      encoder_lr: [1.0e-6]
      seed: [1, 42, 64, 101]
    init_from: {experiment: P3_stage1_oldpenn_v3_b, fold: 0}
    train:
      model_name: DinoClassifierSliceV3
      penn_split_csv: new_penn_datasplit_v5_holdoutF0.csv
      path_root_data: final_cropped_and_masked_slabs_n32_s3_o0
      slices: 32

  # ======================================================================
  # Phase 7 — outer-holdout rotate of the frozen recipe (unfreeze 2, head
  # 1e-5, encoder 1e-6, seed 123). Holdout 0 is P3_staged_v3_b; do not
  # retrain it. Same P3_stage1_oldpenn_v3_b ckpt. Rank/report: pool the
  # five disjoint holdout test predictions (mean of 5 inner-fold probs
  # per exam). Do not pick an inner fold on test AUC.
  # ======================================================================
  - id: P7_staged_v3_b_holdoutF{holdout_fold}
    phase: 7
    enabled: false
    description: Frozen recipe, outer holdout F{holdout_fold} + inner 5-fold.
    vars:
      holdout_fold: [1, 2, 3, 4]
    init_from: {experiment: P3_stage1_oldpenn_v3_b, fold: 0}
    eval:
      splits: [val, test]
    train:
      model_name: DinoClassifierSliceV3
      penn_split_csv: new_penn_datasplit_v5_holdoutF{holdout_fold}.csv
